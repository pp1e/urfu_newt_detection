x-environment: &common-environment
  TZ: Europe/Moscow

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: no
    environment:
      <<: *common-environment
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASS:-admin}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 10s
      timeout: 1s
      retries: 3
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urfu-newt-detection-bot
    restart: no
    environment:
      <<: *common-environment
    env_file:
      - .env
    volumes:
      - ./models:/app/models
    command: python main.py

volumes:
  postgres_data:
